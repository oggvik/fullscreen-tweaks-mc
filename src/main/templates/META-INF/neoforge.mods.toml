modLoader = "javafml"
loaderVersion = "[1,)"
issueTrackerURL = "${repo_issues_url}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_author}"
displayTest = "IGNORE_SERVER_VERSION"
description = '''
${mod_description}
'''
logoFile = "icon.png"

[["dependencies.${mod_id}"]]
modId = "neoforge"
mandatory = true
ordering = "NONE"
side = "CLIENT"

[["dependencies.${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${mc}"
ordering = "NONE"
side = "CLIENT"
