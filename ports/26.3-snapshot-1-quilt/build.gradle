plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom' version '1.15.5'
}

version = project.mod_version
group = project.mod_group

base {
    archivesName = project.mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version as int)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    def targetJava = project.java_version as int
    sourceCompatibility = project.java_version
    targetCompatibility = project.java_version
    if (targetJava > 8) {
        options.release = targetJava
    }
    options.compilerArgs.add('-proc:none')
}

loom {
    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    compileOnly 'net.fabricmc:sponge-mixin:0.16.5+mixin.0.8.7'
    if (findProperty('mod_menu_version')) {
        localRuntime "maven.modrinth:modmenu:${project.mod_menu_version}"
    }
}

processResources {
    def props = [
            version             : project.version,
            mod_id              : project.mod_id,
            mod_name            : project.mod_name,
            mod_author          : project.mod_author,
            mod_description     : project.mod_description,
            mod_license         : project.mod_license,
            mod_group           : project.mod_group,
            repo_url            : project.repo_url,
            repo_issues_url     : project.repo_issues_url,
            repo_sources_url    : project.repo_sources_url,
            minecraft_dependency: project.minecraft_dependency,
            java_version        : project.java_version,
            quilt_loader_version: project.quilt_loader_version,
            pack_format         : project.pack_format
    ]
    inputs.properties(props)
    from(rootProject.file('../../src/main/resources/assets/stop_minimizing_on_focus_loss/lang/en_us.json')) {
        into 'assets/stop_minimizing_on_focus_loss/lang'
    }
    filesMatching(['quilt.mod.json', 'pack.mcmeta']) {
        expand(props)
    }
}
